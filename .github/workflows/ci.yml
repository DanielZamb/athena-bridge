name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  AWS_EC2_METADATA_DISABLED: 'true'
  ATHENA_BRIDGE_USAGE_DB: 'off'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - run: make verify
      - run: make smoke

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - run: go build -trimpath -o bin/ ./cmd/athena-bridge
      - if: runner.os != 'Windows'
        run: |
          ./bin/athena-bridge --help
          ./bin/athena-bridge version
      - if: runner.os == 'Windows'
        run: |
          .\bin\athena-bridge.exe --help
          .\bin\athena-bridge.exe version

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: make secrets
